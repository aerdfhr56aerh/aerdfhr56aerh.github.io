<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="自動抓取最新 JPY/TWD 匯率，精算包含信用卡海外手續費的西瓜卡 (Suica) 儲值台幣成本。">
    <title>Suica 信用卡儲值精算師</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans p-4">
    
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="mb-6 border-b pb-4">
            <h1 class="text-2xl font-black text-gray-800 tracking-wide flex items-center gap-2">
                <span class="text-green-500">🍉</span> Suica 儲值精算師
            </h1>
            <p class="text-gray-500 text-sm mt-1">包含 1.5% 海外信用卡手續費試算</p>
        </div>

        <div class="flex justify-between items-center bg-blue-50 rounded-lg p-3 mb-6 border border-blue-100">
            <div>
                <p class="text-xs text-blue-600 font-bold mb-1">基準匯率 (JPY/TWD)</p>
                <p class="text-lg font-extrabold text-blue-800" id="rate-display">載入中...</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-blue-500 mb-1" id="update-time">讀取資料中...</p>
                <span class="text-[10px] bg-blue-200 text-blue-800 px-2 py-0.5 rounded">基準中價匯率</span>
            </div>
        </div>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">預計儲值日幣 (¥)</label>
                <input type="number" id="jpy-input" value="1000" step="1000" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 text-xl font-bold text-gray-800 transition shadow-sm">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">發卡組織 (影響預估精準度)</label>
                <select id="card-type" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 text-gray-700 bg-white">
                    <option value="jcb">JCB (通常匯率最佳)</option>
                    <option value="mastercard">Mastercard (匯率適中)</option>
                    <option value="visa">Visa (匯率通常稍高)</option>
                </select>
            </div>
        </div>

        <div class="bg-gray-50 rounded-lg p-4 mb-6 border border-gray-200 space-y-2">
            <div class="flex justify-between text-sm text-gray-600">
                <span>純匯率換算：</span>
                <span id="base-twd">NT$ 0</span>
            </div>
            <div class="flex justify-between text-sm text-red-500">
                <span>海外手續費 (1.5%)：</span>
                <span id="fee-twd">+ NT$ 0</span>
            </div>
            <div class="flex justify-between text-xs text-gray-400 pt-2 border-t mt-2">
                <span>組織匯差微調：</span>
                <span id="card-adjustment">計算中...</span>
            </div>
        </div>

        <div class="text-center">
            <p class="text-sm text-gray-500 font-bold mb-1">預估信用卡帳單金額 (NT$)</p>
            <p class="text-5xl font-black text-gray-900" id="final-twd">---</p>
            <p class="text-xs text-gray-400 mt-3">註：實際扣款以發卡行請款日之清算匯率為準。</p>
        </div>
    </div>

    <script>
        let baseRate = 0;

        // 發卡組織的微調係數 (模擬各組織的匯差特性)
        // 這邊用經驗法則微調：JCB通常最貼近基準，Mastercard稍高，Visa再高一點
        const cardModifiers = {
            'jcb': 1.000,         // 基準
            'mastercard': 1.0015, // 約貴 0.15%
            'visa': 1.003         // 約貴 0.3%
        };

        async function fetchRate() {
            try {
                // 取得基準匯率
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                const data = await response.json();
                baseRate = data.rates.TWD;

                document.getElementById('rate-display').textContent = baseRate.toFixed(4);
                
                const now = new Date();
                document.getElementById('update-time').textContent = now.toLocaleDateString() + " 更新";

                calculateTotal();
            } catch (error) {
                document.getElementById('rate-display').textContent = "錯誤";
            }
        }

        function calculateTotal() {
            if (baseRate === 0) return;

            const jpyAmount = parseFloat(document.getElementById('jpy-input').value) || 0;
            const cardType = document.getElementById('card-type').value;
            
            // 1. 套用發卡組織微調係數的匯率
            const adjustedRate = baseRate * cardModifiers[cardType];
            
            // 2. 計算純日幣換台幣 (無手續費)
            const baseTwd = jpyAmount * adjustedRate;
            
            // 3. 計算 1.5% 海外刷卡手續費
            const feeMultiplier = 0.015;
            const feeTwd = baseTwd * feeMultiplier;
            
            // 4. 計算總額
            const totalTwd = baseTwd + feeTwd;

            // 更新畫面 (四捨五入到整數)
            document.getElementById('base-twd').textContent = `NT$ ${Math.round(baseTwd)}`;
            document.getElementById('fee-twd').textContent = `+ NT$ ${Math.round(feeTwd)}`;
            
            // 顯示微調提示
            let adjText = "無";
            if(cardType === 'mastercard') adjText = "略高 (約+0.15%)";
            if(cardType === 'visa') adjText = "較高 (約+0.3%)";
            document.getElementById('card-adjustment').textContent = adjText;

            // 顯示最終總額
            document.getElementById('final-twd').textContent = Math.round(totalTwd);
        }

        // 監聽輸入框與下拉選單的變動，一有改變就重新計算
        document.getElementById('jpy-input').addEventListener('input', calculateTotal);
        document.getElementById('card-type').addEventListener('change', calculateTotal);

        // 網頁載入時啟動
        fetchRate();
    </script>
</body>
</html>
