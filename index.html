<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西瓜卡 (Suica) 儲值匯率計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
        <div class="mb-6">
            <h1 class="text-2xl font-black text-green-500 tracking-wide">Suica 儲值精算師</h1>
            <p class="text-gray-400 text-sm mt-1">自動抓取最新 JPY/TWD 匯率</p>
        </div>

        <div class="bg-green-50 rounded-xl p-4 mb-6 border border-green-100">
            <p class="text-sm text-green-800 font-medium">目前即時匯率</p>
            <p class="text-4xl font-extrabold text-green-600 mt-2" id="rate-display">載入中...</p>
            <p class="text-xs text-green-600/70 mt-2" id="update-time">讀取資料中...</p>
        </div>

        <div class="text-left mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">預計儲值日幣 (¥)</label>
            <input type="number" id="jpy-input" value="1000" step="1000"
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent text-xl font-bold text-gray-800 transition shadow-sm">
        </div>

        <div class="border-t border-gray-200 pt-6">
            <p class="text-sm text-gray-500 font-medium">約合台幣成本 (NT$)</p>
            <p class="text-5xl font-black text-gray-800 mt-2" id="twd-output">---</p>
        </div>
    </div>

    <script>
        let currentRate = 0;

        // 步驟 A：去網路上抓最新的匯率
        async function fetchRate() {
            try {
                // 呼叫免費開源的匯率 API
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                const data = await response.json();

                // 取得日幣換台幣的數字
                currentRate = data.rates.TWD;

                // 把數字顯示在畫面上，取到小數點後四位
                document.getElementById('rate-display').textContent = currentRate.toFixed(4);

                // 標記現在的時間
                const now = new Date();
                document.getElementById('update-time').textContent = "最後更新: " + now.toLocaleTimeString();

                // 抓到匯率後，立刻幫使用者算一次錢
                calculateCost();
            } catch (error) {
                document.getElementById('rate-display').textContent = "網路錯誤";
                console.error("無法取得匯率:", error);
            }
        }

        // 步驟 B：把日幣乘上匯率變成台幣
        function calculateCost() {
            if (currentRate === 0) return; // 如果還沒抓到匯率就不做事
            const jpyAmount = document.getElementById('jpy-input').value;
            const twdCost = jpyAmount * currentRate;
            // 四捨五入到整數
            document.getElementById('twd-output').textContent = Math.round(twdCost);
        }

        // 步驟 C：監聽輸入框，只要數字一變，就馬上重新計算
        document.getElementById('jpy-input').addEventListener('input', calculateCost);

        // 步驟 D：網頁一打開，就啟動抓匯率的動作
        fetchRate();
    </script>
</body>

</html>
